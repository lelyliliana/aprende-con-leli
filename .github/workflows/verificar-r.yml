name: Verificar curso R
on:
  push:
    paths: ['cursos/r/**', '.github/workflows/verificar-r.yml']
  pull_request:
    paths: ['cursos/r/**', '.github/workflows/verificar-r.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  curso-r:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            r: '4.3.3'
          - os: ubuntu-latest
            r: release
          - os: windows-latest
            r: release
          - os: macos-latest
            r: release
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cursos/r
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: cursos/r
          dependencies: '"hard"'
          packages: |
            any::dplyr
            any::tidyr
            any::ggplot2
            any::readr
            any::readxl
            any::knitr
            any::rmarkdown
            any::jsonlite
          install-quarto: true
          quarto-version: '1.10.19'
      - run: Rscript --vanilla scripts/verificar.R --quarto
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curso-r-${{ matrix.os }}-${{ matrix.r }}
          path: cursos/r/salidas/
